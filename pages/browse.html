<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelajahi | NightStream</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar scrolled">
    <div class="nav-left">
      <a href="../index.html" class="logo">Night<span>Stream</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="browse.html" class="active">Jelajahi</a></li>
        <li><a href="mylist.html">Daftar Saya</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari video..." />
      </div>
      <div class="user-menu">
        <i class="fas fa-user-circle"></i>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <h1 id="pageTitle">Jelajahi</h1>
    <p id="resultCount" style="color:var(--text-secondary)">Loading...</p>
    
    <div class="filters" id="filters">
      <!-- populated by JS -->
    </div>
    
    <div style="display:flex;justify-content:flex-end;margin-top:1rem">
      <select id="sortSelect" class="sort-select">
        <option value="popular">Paling Populer</option>
        <option value="newest">Terbaru</option>
        <option value="rating">Rating Tertinggi</option>
      </select>
    </div>
  </div>

  <main class="container">
    <div class="video-grid" id="browseGrid">
      <!-- populated by JS -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 NightStream. Hanya untuk usia 18+.</p>
    </div>
  </footer>

  <script src="../data/videos.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initBrowsePage);
  </script>
</body>
</html>
