<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightVid - Video Streaming</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Night<span>Vid</span></a>
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="Cari video..." />
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-cat="all">Semua</button>
        <button class="tab" data-cat="amateur">Amateur</button>
        <button class="tab" data-cat="professional">Professional</button>
        <button class="tab" data-cat="asian">Asian</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="closeBtn"><i class="fas fa-times"></i></button>
      <div class="player" id="player">
        <div class="player-inner">
          <i class="fas fa-play-circle"></i>
          <p>Preview Mode</p>
          <button class="play-btn" id="playBtn"><i class="fas fa-play"></i> Putar</button>
        </div>
      </div>
      <div class="info">
        <h2 id="modalTitle">-</h2>
        <div class="meta">
          <span id="modalViews"><i class="fas fa-eye"></i> -</span>
          <span id="modalDur"><i class="fas fa-clock"></i> -</span>
          <span id="modalCat"><i class="fas fa-tag"></i> -</span>
        </div>
        <p id="modalDesc" class="desc">-</p>
      </div>
    </div>
  </div>

  <script src="data/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
