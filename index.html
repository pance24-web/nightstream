<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NightVid</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">Night<span>Vid</span></a>
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search" placeholder="Cari..." />
    </div>
  </header>

  <main class="main">
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="closeBtn">&times;</button>
      <div class="player">
        <div class="player-inner">
          <i class="fas fa-play-circle"></i>
          <p>Preview</p>
          <button class="play-btn" id="playBtn">Putar</button>
        </div>
      </div>
      <div class="info">
        <h2 id="modalTitle">-</h2>
        <p id="modalMeta" class="meta">-</p>
      </div>
    </div>
  </div>

  <script src="data/videos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
